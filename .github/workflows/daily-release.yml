name: Daily Release
# Runs daily at KST 07:00 (UTC 22:00 previous day). Auto-releases if there are changes since the last release.
# Conventional Commits-based version bump: feat → minor, fix → patch, breaking → major

on:
  schedule:
    - cron: "0 22 * * *" # UTC 22:00 = KST 07:00
  workflow_dispatch: # manual trigger

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check for changes since last release
        id: changes
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LATEST_TAG" ]; then
            echo "No previous release found. Checking all commits."
            COMMIT_COUNT=$(git rev-list --count HEAD)
          else
            COMMIT_COUNT=$(git rev-list --count "${LATEST_TAG}..HEAD")
          fi
          echo "latest_tag=${LATEST_TAG}" >> "$GITHUB_OUTPUT"
          echo "commit_count=${COMMIT_COUNT}" >> "$GITHUB_OUTPUT"
          if [ "$COMMIT_COUNT" -eq 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No changes since ${LATEST_TAG}. Skipping release."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "${COMMIT_COUNT} commits since ${LATEST_TAG}."
          fi

      - name: Determine next version
        if: steps.changes.outputs.skip == 'false'
        id: version
        run: |
          LATEST_TAG="${{ steps.changes.outputs.latest_tag }}"
          if [ -z "$LATEST_TAG" ]; then
            echo "next_version=v0.1.0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Strip 'v' prefix for parsing
          VERSION="${LATEST_TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          # daily-release auto-bumps minor (feat) or patch only.
          # Major bump is manual: a maintainer tags the new major version themselves.
          # `feat!:` / `BREAKING CHANGE` markers surface in release notes, not in version.
          COMMITS=$(git log "${LATEST_TAG}..HEAD" --pretty=format:"%s")
          HAS_FEAT=$(echo "$COMMITS" | grep -cE '^feat(\(.+\))?!?:' || true)

          if [ "$HAS_FEAT" -gt 0 ]; then
            MINOR=$((MINOR + 1))
            PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi

          NEXT="v${MAJOR}.${MINOR}.${PATCH}"
          echo "next_version=${NEXT}" >> "$GITHUB_OUTPUT"
          echo "Bumping ${LATEST_TAG} → ${NEXT}"

      # Writes VERSIONING.md step 1 (manifest version) before the tag is created,
      # so the tag points at a commit whose plugin.json already matches. Pushing
      # before `gh release create --target main` also keeps this commit inside the
      # new tag, so it does not trigger another release tomorrow.
      #
      # This step must never block the release: releasing with a stale manifest is
      # a cosmetic defect, releasing nothing is an outage. Every failure path here
      # warns and returns success, and `continue-on-error` covers the unexpected.
      # The `github.ref` guard keeps a `workflow_dispatch` from a side branch from
      # fast-forwarding main onto that branch.
      - name: Sync plugin manifest version
        if: steps.changes.outputs.skip == 'false' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # plugin.json records bare semver; git tags carry the 'v' prefix.
          MANIFEST_VERSION="${{ steps.version.outputs.next_version }}"
          MANIFEST_VERSION="${MANIFEST_VERSION#v}"

          jq --arg v "$MANIFEST_VERSION" '.version = $v' .claude-plugin/plugin.json > plugin.json.tmp
          mv plugin.json.tmp .claude-plugin/plugin.json

          if git diff --quiet .claude-plugin/plugin.json; then
            echo "plugin.json already at ${MANIFEST_VERSION}. Nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .claude-plugin/plugin.json
          git commit -m "chore(release): sync plugin.json to ${MANIFEST_VERSION}"

          # main may have moved since checkout. Rebase and retry, then give up
          # rather than fail: the release matters more than the manifest.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "plugin.json → ${MANIFEST_VERSION}"
              exit 0
            fi
            echo "Push rejected on attempt ${attempt}; rebasing onto origin/main."
            git fetch origin main || break
            git rebase origin/main || { git rebase --abort || true; break; }
          done

          # Reaching here means the push was refused for a reason a rebase does
          # not fix. Since 2026-08-18 that reason is branch protection: the
          # `protect-main` ruleset requires a pull request on the default branch
          # and its only bypass actor is the admin repository role, which
          # GITHUB_TOKEN does not hold. The retry loop above can therefore never
          # succeed while that rule is active, and the old behaviour — warn and
          # move on — let the manifest drift from the tag silently, which is the
          # exact defect #88 was filed for.
          #
          # Fall back to a pull request. The branch name is fixed, so repeated
          # releases force-update one PR in place rather than opening a new one
          # every night. Only the default branch is protected, so this push is
          # allowed. The release itself is still never blocked: every path here
          # ends in `exit 0`.
          BRANCH=chore/sync-plugin-manifest

          if ! git push --force origin "HEAD:refs/heads/${BRANCH}"; then
            echo "::warning::plugin.json not synced to ${MANIFEST_VERSION}: pushing ${BRANCH} failed too."
            exit 0
          fi

          if gh pr view "${BRANCH}" --json number >/dev/null 2>&1; then
            gh pr edit "${BRANCH}" --title "chore(release): sync plugin.json to ${MANIFEST_VERSION}" || true
            echo "::warning::plugin.json on main is stale; updated the open ${BRANCH} PR to ${MANIFEST_VERSION}."
          else
            gh pr create --base main --head "${BRANCH}" \
              --title "chore(release): sync plugin.json to ${MANIFEST_VERSION}" \
              --body "$(printf '%s\n' \
                "\`.claude-plugin/plugin.json\` records the plugin version that Claude Code reads at install time, so it has to match the release tag." \
                "" \
                "The daily release job used to commit this bump straight to \`main\`. Branch protection now requires a pull request there, and \`GITHUB_TOKEN\` is not a bypass actor, so the job opens this PR instead." \
                "" \
                "Merging it is the whole fix; the next release force-updates this same branch rather than opening another PR." \
                "" \
                "Refs #88.")" || true
            echo "::warning::plugin.json on main is stale; opened a ${BRANCH} PR for ${MANIFEST_VERSION}."
          fi
          exit 0

      - name: Generate release notes with Claude
        if: steps.changes.outputs.skip == 'false'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GH_AW_GITHUB_TOKEN }}
          bot_id: '${{ vars.CLAUDE_BOT_ID }}'
          bot_name: '${{ vars.CLAUDE_BOT_NAME }}'
          prompt: |
            You are a release manager for the **aerospike-ce-ecosystem** Claude Code plugin.

            ## Task
            Create a GitHub release for version **${{ steps.version.outputs.next_version }}**.
            Previous version: **${{ steps.changes.outputs.latest_tag }}** (${{ steps.changes.outputs.commit_count }} commits)

            ### Step 1: Analyze Changes
            Run `git log ${{ steps.changes.outputs.latest_tag }}..HEAD --pretty=format:"%h %s" --no-merges` to see all commits.

            ### Step 2: Write Release Notes
            Write release notes in this exact format (Korean descriptions, English technical terms):

            ```
            ## What's Changed

            ### Features
            - **feature name**: description (#PR)

            ### Bug Fixes
            - **fix name**: description (#PR)

            ### Skills
            - **skill name**: what changed (#PR)

            ### Improvements
            - **improvement name**: description (#PR)

            ### CI/CD
            - description

            ### Documentation
            - description

            **Full Changelog**: https://github.com/${{ github.repository }}/compare/${{ steps.changes.outputs.latest_tag }}...${{ steps.version.outputs.next_version }}
            ```

            Only include sections that have entries. Skip empty sections. The "Skills" section is plugin-specific — use it for changes scoped to a single skill (e.g., `feat(skill): ...` or `feat(acko-deploy): ...`).

            ### Step 3: Create the Release
            Save the release notes to a file and create the release:
            ```bash
            gh release create "${{ steps.version.outputs.next_version }}" \
              --title "release ${{ steps.version.outputs.next_version }}" \
              --notes-file /tmp/release-notes.md \
              --target main
            ```

            ### Step 4: Verify
            Run `gh release view ${{ steps.version.outputs.next_version }}` to confirm the release was created.

            ## Constraints
            - Use Korean for descriptions, English for technical terms
            - Group by Conventional Commit type (feat → Features, fix → Bug Fixes, etc.)
            - Include PR numbers where available (extract from commit messages)
            - Do NOT include merge commits or trivial changes (typos, formatting)
          claude_args: |
            --max-turns ${{ vars.CLAUDE_MAX_TURNS }}
            --model ${{ vars.CLAUDE_MODEL }}
            --dangerously-skip-permissions
          settings: '${{ vars.CLAUDE_SETTINGS }}'
